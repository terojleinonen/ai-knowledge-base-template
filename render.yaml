# Render Blueprint for the API: https://render.com/docs/blueprint-spec
# Free plan: sleeps after 15 min idle (~1 min cold start), ephemeral disk.
# Values marked `sync: false` are secrets you enter in the Render dashboard.
services:
  - type: web
    name: knowledge-base-api
    runtime: docker
    plan: free
    region: frankfurt          # keep in the same region as the Neon database (AWS eu-central-1)
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false            # php artisan key:generate --show
      - key: APP_URL
        sync: false            # https://<service>.onrender.com
      - key: LOG_CHANNEL
        value: stderr

      # Neon Postgres (free, doesn't expire)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false            # postgresql://user:pass@host/db?sslmode=require
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: array
      - key: RUN_WORKER_IN_WEB
        value: "true"

      - key: CORS_ALLOWED_ORIGINS
        sync: false            # https://<project>.pages.dev

      # AI providers
      - key: KB_CHAT_PROVIDER
        value: anthropic
      - key: KB_CHAT_MODEL
        value: claude-opus-5-5   # or: openai + gpt-6-luna (free tier: 50 requests/day)
      - key: KB_CHAT_EFFORT
        value: medium            # Claude Opus 5.5's default, set explicitly
      - key: KB_CHAT_FALLBACKS
        value: default           # retry declined requests on Anthropic's recommended fallback model
      - key: KB_EMBEDDINGS_PROVIDER
        value: openai
      - key: KB_EMBEDDINGS_MODEL
        value: text-embedding-3-small
      - key: KB_RETRIEVAL_TOP_K
        value: "4"
      - key: KB_RETRIEVAL_MIN_SCORE
        value: "0.2"           # calibrate with: php artisan kb:eval --retrieval-only
      - key: ANTHROPIC_API_KEY   # chat
        sync: false
      - key: OPENAI_API_KEY      # embeddings (Anthropic has no embeddings API)
        sync: false

      # Public demo: guest sessions, no open registration, bounded spend
      - key: KB_DEMO_ENABLED
        value: "true"
      - key: KB_REGISTRATION_ENABLED
        value: "false"
      - key: KB_LIMIT_QUESTIONS_PER_USER
        value: "15"
      - key: KB_LIMIT_QUESTIONS_PER_DAY
        value: "100"           # bounds daily spend; see README for cost per question
      - key: KB_LIMIT_DOCUMENTS_PER_USER
        value: "6"
      - key: KB_UPLOAD_MAX_KB
        value: "2048"
