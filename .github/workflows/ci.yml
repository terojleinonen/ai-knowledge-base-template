name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, pdo_pgsql, zip
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - name: Code style
        if: matrix.database == 'sqlite'
        run: vendor/bin/pint --test

      - name: Static analysis
        if: matrix.database == 'sqlite'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests
        run: vendor/bin/pest
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.database == 'pgsql' && 'testing' || ':memory:' }}
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: kb-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name kb -p 8080:10000 \
            -e PORT=10000 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/kb.sqlite \
            -e CACHE_STORE=database -e QUEUE_CONNECTION=database \
            -e RUN_WORKER_IN_WEB=true -e KB_REGISTRATION_ENABLED=false \
            --entrypoint sh kb-api:ci -c 'touch /tmp/kb.sqlite && exec sh docker/start.sh'

          for i in $(seq 1 30); do curl -fsS http://localhost:8080/up >/dev/null && break; sleep 2; done

          curl -fsS http://localhost:8080/up
          curl -fsS http://localhost:8080/api/config | tee /dev/stderr | grep -q '"registration":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/json' http://localhost:8080/api/documents)" = 401

          # The background queue worker and scheduler are running.
          # (No `ps` in the slim image, so read process command lines from /proc.)
          procs="$(docker exec kb sh -c 'for f in /proc/[0-9]*/cmdline; do tr "\\0" " " < "$f"; echo; done 2>/dev/null')"
          echo "$procs" | grep -q 'queue:work'
          echo "$procs" | grep -q 'schedule:work'

      - name: Container logs
        if: always()
        run: docker logs kb 2>&1 | tail -50 || true
